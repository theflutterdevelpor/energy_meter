<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#00ff9f;stop-opacity:1"></stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#0a0f1c"></rect>

  <!-- Circle -->
  <circle cx="256" cy="256" r="140" stroke="url(#grad)" stroke-width="20" fill="none"></circle>

  <!-- Lightning Bolt -->
